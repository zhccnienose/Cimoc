plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'org.jetbrains.compose' version '1.6.11'
}

group = 'com.haleydu.cimoc'
version = '0.1.0'

// 工具链与另两个模块一致：Gradle 8.7 + JDK 17 + Kotlin 1.9.24。
// Compose 的版本必须与 Kotlin 对齐：Compose Multiplatform 1.6.11 对应的就是 Kotlin 1.9.24，
// 错开一个版本会在编译期报「compose compiler 与 Kotlin 版本不兼容」。
repositories {
    mavenCentral()
    // 必须加。Compose 的 desktop 产物依赖 androidx.annotation / androidx.collection /
    // androidx.lifecycle，这几个**只在 Google 的仓库里**，Maven Central 上没有——
    // 缺了它的报错是「Could not find androidx.annotation:annotation:1.8.0」，
    // 看起来像版本写错，实际是仓库没配对。
    //
    // Gradle 的 google() 指向 dl.google.com/dl/android/maven2（不是 maven.google.com，
    // 后者在部分网络下连不通），所以走它没问题。
    google()
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // 坐标由 settings.gradle 的 includeBuild 替换成本地 cimoc-backend 构建。
    // 用 implementation 而非 api：这是个应用程序（叶子节点），没有下游消费者，
    // 不需要把后端的类型再往外传递。
    implementation 'com.haleydu.cimoc:cimoc-backend:0.1.0'

    // 当前操作系统的 Compose 运行时 + Skiko 原生库。
    // 用 currentOs 而不是逐平台列举，避免把另外两个平台的几百 MB 原生库也拖下来。
    implementation compose.desktop.currentOs
}

compose.desktop {
    application {
        mainClass = 'com.haleydu.cimoc.desktop.MainKt'

        // 源码与界面文案里有中文。Kotlin 把字面量按 UTF-8 编进 class 常量池，
        // 但 JVM 输出到控制台时按 file.encoding 解码，在 UTF-8 终端里不指定就是乱码。
        // 用 jvmArgs(...) 方法而不是 `jvmArgs += [...]`：这个属性在 DSL 里只暴露了 getter，
        // Groovy 的 `+=` 会走「读-改-写」而报 read-only。
        jvmArgs '-Dfile.encoding=UTF-8'

        nativeDistributions {
            // 只做「可运行目录」和「app-image」，**不做 MSI**：
            // Windows 上打 MSI 需要本机装着 WiX 3.x，没装会直接构建失败。
            //
            // 类名写全路径而不是 import：IDE 的 Groovy 支持解析不了这个插件的类路径，
            // 会把 import 标红当成无用导入删掉（删了之后这里报「unknown property
            // TargetFormat」，构建直接挂）。点全名 Groovy 在运行期照样解得开。
            targetFormats org.jetbrains.compose.desktop.application.dsl.TargetFormat.AppImage

            packageName = 'Cimoc'
            packageVersion = '0.1.0'
            // 这行中文是「直接跑 gradlew packageAppImage 会失败」的原因：Compose 插件把
            // 参数写成 @参数文件（UTF-8），而 JDK 17 的 jpackage 按**平台默认字符集**读它
            // （中文 Windows 上是 GBK），解码当场抛 MalformedInputException，
            // 报错全文只有一句 "Input length = 1"，看不出跟编码有关。
            //
            // 走 cimoc-desktop/package-exe.sh 打包，脚本里给 jpackage 的 JVM 设了
            // -Dfile.encoding=UTF-8。想直接跑 gradlew 的话，得自己带上
            // JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8；或者把这行改成纯 ASCII
            // （JDK 18 起默认 UTF-8，那段说明到这里就不适用了）。
            description = 'Cimoc 桌面端'
            vendor = 'haleydu'

            // 不裁剪模块。jlink 的自动推断（jdeps）只看静态引用，看不见反射，
            // 而本项目的图源注册就是靠反射扫描类路径——漏掉的模块在开发期毫无症状，
            // 只在「打包后 0 个图源」时才暴露。用体积换确定性。
            includeAllModules = true
        }
    }
}

// 运行时镜像只压缩、不减模块。
//
// 与上面的 includeAllModules 不冲突：模块清单仍是「全都装」，jlink 出来的镜像里
// 反射能看见的东西一个没少，改的只是镜像内部的存储方式。真正裁模块要动的是上面那行，
// 那种事不做（理由见上）。
//
// 档位是 jlink 自己的：1 = 常量字符串共享，2 = 整体 ZIP。实测（JDK 17，ALL-MODULE-PATH，
// 此时插件已经带了 --strip-debug）：
//     不压缩 130MB → compress=1 100MB → compress=2 77MB
// 代价是类加载多一步解压，冷启动慢几十毫秒。嫌启动慢就把这段删掉，只影响体积。
//
// 为什么走任务属性：Compose 1.6.11 的 nativeDistributions 只暴露 modules /
// includeAllModules，压缩级别挂在内部任务上（Kotlin internal，字节码里的名字带 $compose 后缀）。
// 升级 Compose 后这行若报 MissingProperty，就是它改名了——删掉这段即可，
// 功能不受影响，只是包变大。
//
// 用 matching + configureEach 而不是 named(...)：这个任务不是插件 apply 时就注册的，
// 在脚本主体里 named('createRuntimeImage') 会直接报「找不到任务」。
tasks.matching { it.name == 'createRuntimeImage' }.configureEach { jlink ->
    // 属性名必须带接收者（jlink.xxx）写：直接写 'compressionLevel$compose' 的话
    // Groovy 会把它当成一个字符串字面量再去调 .set()，报「String 没有 set 方法」。
    // 枚举同样点全名，理由见上面 targetFormats 那段。
    jlink.'compressionLevel$compose'.set(
        org.jetbrains.compose.desktop.application.internal.RuntimeCompressionLevel.ZIP
    )
}
