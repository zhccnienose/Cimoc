# -Duser.language=en: JDK 的 javac 提示信息跟随系统 locale，中文 Windows 下会在
# UTF-8 终端里显示成乱码。强制英文即可，代价是提示信息变英文，可接受。
# -Dfile.encoding=UTF-8: 源码含中文注释与中文字符串字面量。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US

org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# 本构建必须跑在 JDK 8 上（Kotlin 1.5.10 在 JDK 17 上代码生成会崩）。
# 这里刻意不写 org.gradle.java.home：那是机器相关的绝对路径，提交进仓库会污染别人的环境。
# 如果你的默认 java 不是 8，请改在自己的 ~/.gradle/gradle.properties 里，例如：
#   org.gradle.java.home=D:\\java\\java8
