# -Duser.language=en: JDK 的 javac 提示信息跟随系统 locale，中文 Windows 下会在
# UTF-8 终端里显示成乱码。强制英文即可，代价是提示信息变英文，可接受。
# -Dfile.encoding=UTF-8: 源码含中文注释与中文字符串字面量。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US

org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# 本构建需要 JDK 17（Gradle 8.7 + Kotlin 1.9 的标准组合），与 cimoc-core 一致。
# 如果你的默认 java 不是 17，在这里取消注释并改成你的路径：
#   org.gradle.java.home=D:\\java\\java17
# 注意：**不要**写进用户级的 ~/.gradle/gradle.properties —— 那会影响所有 Gradle 项目，
# 包括同仓库的 Android 工程（AGP 4.2.2 需要 JDK 8/11，会被强制 JDK 17 弄坏）。
